[project]
name = "catalogbridge"
version = "0.1.0"
description = "Migrates vendor product catalogs from any source into any target marketplace schema"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Sabira Khan" }]
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "openai>=1.58",
    "typer>=0.15",
    "rich>=13.9",
    "tenacity>=9.0",
    "pyyaml>=6.0",
    "openpyxl>=3.1.5",
]

[project.scripts]
catalogbridge = "app.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
    "types-openpyxl>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "ERA", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["ANN401"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "backend"
plugins = []

[[tool.mypy.overrides]]
module = ["respx.*"]
ignore_missing_imports = true
